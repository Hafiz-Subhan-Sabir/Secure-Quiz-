[project]
name = "intelliquiz-desktop"
version = "0.1.0"
description = "IntelliQuiz student desktop exam client"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "cryptography>=43.0.0",
  "qrcode>=8.0",
  "Pillow>=10.0.0",
  "websockets>=13.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "opencv-python>=4.10.0",
  "mediapipe>=0.10.14",
  "numpy>=1.26.0",
  "joblib>=1.4.0",
  "scikit-learn>=1.5.0",
  "mss>=9.0.0",
]

[project.optional-dependencies]
ui = [
  "PySide6>=6.7.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
intelliquiz-desktop = "intelliQuiz_desktop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["intelliQuiz_desktop*"]

[tool.setuptools.package-data]
intelliQuiz_desktop = ["ui/*.html", "models/*"]
